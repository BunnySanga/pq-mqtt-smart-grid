# T7: TLS 1.3 with an external per-device PSK for hop authentication (no certificates, no signatures).
# Started with OPENSSL_CONF=/work/hybrid-only.cnf so the (EC)DHE part must still be hybrid (psk_dhe_ke).
per_listener_settings false
allow_anonymous false
log_dest file /tmp/mosq_psk.log
log_type error
log_type warning
log_type notice
log_type information
set_tcp_nodelay true
psk_file /audit/pskfile
user root

listener 8892
psk_hint pqgrid
tls_version tlsv1.3
use_identity_as_username true

# Second listener: the same PSK over TLS 1.2 (to show what the broker actually offers for PSK)
listener 8893
psk_hint pqgrid
tls_version tlsv1.2
use_identity_as_username true
