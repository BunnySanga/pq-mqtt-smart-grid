# Same as mosquitto_audit.conf, on port 8891, for a broker whose clock is moved with libfaketime (T2 only).
per_listener_settings false
allow_anonymous false
log_dest file /tmp/mosq_ft.log
log_type error
log_type warning
log_type notice
set_tcp_nodelay true
user root

listener 8891
cafile /audit/pki/ca.crt
certfile /audit/pki/broker.crt
keyfile /audit/pki/broker.key
tls_version tlsv1.3
require_certificate true
use_identity_as_username true
