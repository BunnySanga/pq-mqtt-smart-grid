# Audit broker: the §5.6 settings of BalaMP.md with ECDSA P-256 certificates.
# Start with OPENSSL_CONF=/work/hybrid-only.cnf so only hybrid groups are accepted (as the design pins).
# No acl_file: every authenticated client may use every topic (access control was validated separately).
per_listener_settings false
allow_anonymous false
log_dest file /tmp/mosq_audit.log
log_type error
log_type warning
log_type notice
log_type information
set_tcp_nodelay true
max_packet_size 300000
user root

listener 8890
cafile /audit/pki/ca.crt
certfile /audit/pki/broker.crt
keyfile /audit/pki/broker.key
tls_version tlsv1.3
require_certificate true
use_identity_as_username true
